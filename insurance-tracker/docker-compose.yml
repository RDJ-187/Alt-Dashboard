# PostgreSQL for the insurance tracker. Data persists in the named volume `pgdata`.
#   docker compose up -d        start
#   docker compose down         stop (data kept)
services:
  db:
    image: postgres:17.6-alpine
    container_name: insurance-db
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"   # host port (from .env) -> container port; local machine only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
